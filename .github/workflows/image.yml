name: image

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A publishing run is never cancelled: one stopped between the push by digest and the tag leaves
# an image in the registry that nothing names.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/runonflux/explorer

# Actions are pinned to commits; the comment is the release each was resolved from.
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed before it is tested, and tested as pulled back: the tag then names the bytes that
      # passed, not a second build of the same source.
      - name: Build and push by digest
        id: pushed
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Pull the image under test
        if: github.event_name != 'pull_request'
        run: |
          reference="${IMAGE}@${{ steps.pushed.outputs.digest }}"
          docker pull "$reference"
          echo "IMAGE_UNDER_TEST=$reference" >> "$GITHUB_ENV"

      - name: Build the image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: explorer:test

      - name: Name the image under test
        if: github.event_name == 'pull_request'
        run: echo "IMAGE_UNDER_TEST=explorer:test" >> "$GITHUB_ENV"

      - name: Smoke test
        run: test/smoke.sh "$IMAGE_UNDER_TEST"

      - id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=master,enable={{is_default_branch}}

      - name: Tag the digest that passed
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${IMAGE}@${{ steps.pushed.outputs.digest }}"
          {
            echo '## Published'
            echo
            jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON" | sed 's/^/- `/; s/$/`/'
            echo "- digest \`${{ steps.pushed.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
